##### Prefix / basic #####
set -g prefix C-s
bind C-s send-prefix
unbind C-b

set -s escape-time 0

# Pass modified keys (Shift+Enter, Ctrl+Enter, Alt+Enter) through to programs that ask for them, such as pi.
# -q: older tmux without these options skips them silently (3.2-3.4 have extended-keys but not the format).
set -gq extended-keys on
set -gq extended-keys-format csi-u
# Tell tmux the outer terminal (Ghostty, kitty, iTerm2, ...) understands extended keys, so it asks for them; without
# this, tmux 3.2-3.4 gets ctrl+shift+o etc. as plain ctrl+o. Terminals that lack support ignore the request.
set -asq terminal-features ',xterm*:extkeys'
# Old tmux builds (e.g. Ubuntu 22.04's 3.2a) default to default-terminal "screen", and with a screen* TERM tmux draws
# italics as reverse video (pi's faint-italic thinking text shows up highlighted white). Switch to tmux-256color only
# when tmux would otherwise use screen*, on Linux, and the terminfo entry exists; newer tmux (and macOS) is untouched.
# RGB lets 24-bit colours through to the outer terminal.
%if "#{m:screen*,#{default-terminal}}"
if-shell '[ "$(uname)" = Linux ] && infocmp tmux-256color >/dev/null 2>&1' {
    set -g default-terminal "tmux-256color"
    set -ga terminal-overrides ",xterm-256color:RGB"
}
%endif

set -g update-environment "DISPLAY SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID WINDOWID XAUTHORITY"

##### SSH agent: keep long-lived panes working across reconnects #####
# update-environment above refreshes SSH_AUTH_SOCK in the *session* environment on every attach, but a shell that is
# already running in a pane keeps the value it was spawned with. After you reconnect over a new SSH login the old
# /tmp/ssh-*/agent.* socket is gone, so ssh/git fail inside tmux while working outside it.
# Fix: (1) on every attach, re-point a stable symlink at the live socket; (2) start new panes/windows with
# SSH_AUTH_SOCK set to that symlink. Panes opened before this config was loaded keep their old value: open a new pane
# once (or run `export SSH_AUTH_SOCK=$HOME/.ssh/ssh_auth_sock` in them).
set -g @ssh_link_cmd 's=$(tmux show-environment SSH_AUTH_SOCK | cut -d= -f2-); [ -S "$s" ] && ln -sfn "$s" "$HOME/.ssh/ssh_auth_sock"'
set-hook -g client-attached 'run-shell -b "#{@ssh_link_cmd}"'
run-shell -b "#{@ssh_link_cmd}"
set -g default-command "env SSH_AUTH_SOCK=$HOME/.ssh/ssh_auth_sock $SHELL -l"

##### Titles #####
set -g automatic-rename on
set -g set-titles on

##### Input / mouse / copy-mode #####
set -g mouse on
setw -g mode-keys vi

# Keep selection active; don't auto-exit copy-mode on drag end
unbind-key -T copy-mode-vi MouseDragEnd1Pane

##### Clipboard: copy from anywhere -> Mac clipboard (OSC52) #####
# Requires a terminal that supports OSC52 (iTerm2, modern Terminal.app, VSCode terminal usually OK).
# Works over SSH because tmux writes the escape sequence to your local terminal.
set -g set-clipboard on

# Use tmux's built-in OSC52 clipboard path: -w writes to the system clipboard via terminal
unbind-key -T copy-mode-vi y
bind-key   -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'tmux load-buffer -w -'

##### Panes / splits #####
bind-key v split-window -h
bind-key s split-window -v

##### Resizing #####
bind J resize-pane -D 10
bind K resize-pane -U 10
bind H resize-pane -L 10
bind L resize-pane -R 10

##### Pane navigation #####
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

##### Reload #####
bind r source-file ~/.tmux.conf

##### pi-fleet: pi sessions, one window each (pi | nvim); see docs/pi-fleet-design.md #####
# Everything goes through bin/pi-fleet (on PATH via ~/bin); without it these stay inert.
# Bell: a pi that stops (waiting, question, error) rings BEL; flag that window unless it is the current one.
setw -g monitor-bell on
set -g bell-action other
set -g visual-bell off
# Notification bar: waiting fleet sessions by their real window index, so prefix N jumps there.
set -g status-interval 5
set -g status-left-length 80
set -g status-left '[#{session_name}] #(pi-fleet bar --pane "#{pane_id}" 2>/dev/null)'
# Switching to a window (or session) acknowledges the pi sessions in it: waiting ◐ becomes idle ○.
set-hook -g session-window-changed 'run-shell -b "pi-fleet seen --window #{window_id} >/dev/null 2>&1 || true"'
set-hook -g client-session-changed 'run-shell -b "pi-fleet seen --window #{window_id} >/dev/null 2>&1 || true"'
# prefix e: jump between a pi pane and its paired nvim (by pane id, so added or swapped panes do not matter).
bind e if -F '#{@pi_fleet_peer}' {
    run-shell -b 'tmux select-window -t "#{@pi_fleet_peer}" \; select-pane -t "#{@pi_fleet_peer}" 2>/dev/null || pi-fleet peer --select "#{pane_id}"'
} {
    display-message 'pi-fleet: no paired pane here'
}
# prefix g: the fleet dashboard window (from it: back to the last window); prefix G: dashboard popup.
bind g if -F '#{@pi_fleet_dashboard}' last-window {
    run-shell -b 'pi-fleet dashboard --window --pane "#{pane_id}"'
}
bind G display-popup -E -w 95% -h 90% 'pi-fleet dashboard'
