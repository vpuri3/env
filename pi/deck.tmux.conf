# pi-deck: the private tmux server that holds the pi deck (docs/pi-deck-design.md).
#   tmux -L pifleet -f ~/env/pi/deck.tmux.conf      (started by `pi-fleet deck-start` / bin/pi-deck-attach)
# session `deck`, window `deck` (design §15): pane 0 the session list (`pi-fleet deck`, @pi_fleet_role=list,
# top-left), pane 1 the nvim slot (bottom-left), pane 2 the pi slot (right half); the selected session's nvim
# and pi (or the holders) are swapped into them from the session `pool` (pi/extensions/fleet/deck.ts).
# Own minimal config on purpose; the terminal/keys/clipboard lines mirror ~/env/tmux.conf (keep them in sync).

##### Prefix / terminal (same as ~/env/tmux.conf) #####
set -g prefix C-s
unbind C-b
set -s escape-time 0
set -gq extended-keys on
set -gq extended-keys-format csi-u
# In the popup the deck client's TERM is the outer tmux's default-terminal (tmux-256color or screen*), so those get
# extkeys too; Shift+Enter then reaches pi byte-exact through the popup.
set -asq terminal-features ',xterm*:extkeys,tmux*:extkeys,screen*:extkeys'
%if "#{m:screen*,#{default-terminal}}"
if-shell '[ "$(uname)" = Linux ] && infocmp tmux-256color >/dev/null 2>&1' {
    set -g default-terminal "tmux-256color"
    set -ga terminal-overrides ",xterm-256color:RGB"
}
%endif
set -g update-environment "DISPLAY SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID WINDOWID XAUTHORITY"
# Re-point the stable agent link on attach (a direct `pf` attach does not go through the user's tmux). Never at the
# link itself: pi-deck-attach exports SSH_AUTH_SOCK=<the link>, and `ln -sfn` would make it point to itself.
set -g @ssh_link_cmd 's=$(tmux show-environment SSH_AUTH_SOCK | cut -d= -f2-); [ -S "$s" ] && [ "$s" != "$HOME/.ssh/ssh_auth_sock" ] && ln -sfn "$s" "$HOME/.ssh/ssh_auth_sock"; true'
set-hook -g client-attached 'run-shell -b "#{@ssh_link_cmd}"'

##### Look / input #####
set -g status off
set -g mouse on
setw -g mode-keys vi
unbind-key -T copy-mode-vi MouseDragEnd1Pane
set -g set-clipboard on
unbind-key -T copy-mode-vi y
bind-key   -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'tmux load-buffer -w -'
# The list TUI rings the deck client's bell when a session starts waiting.
set -g bell-action any

##### Sizes (design §5) #####
# New windows (all in the pool) are created at the pool's default-size, the right-slot size, never at some
# client's size; only the deck window follows its clients (the list sets window-size latest on it).
setw -g window-size manual

##### Panes: dead panes stay until the list reconciles them #####
set -g @deck_list_pct 50
set -g @deck_list_height_pct 50
setw -g remain-on-exit on
# The list respawns itself; any other dead pane wakes the list (SIGUSR2), which replaces/kills it.
set-hook -g pane-died {
    if -F '#{==:#{@pi_fleet_role},list}' {
        respawn-pane
    } {
        run-shell -b 'kill -USR2 #{@deck_tui_pid} 2>/dev/null; true'
    }
}

##### Agent views (design §16) #####
# The list marks a pi whose subagent view it opened (@pi_fleet_agents_view); once that pane is focused (C-l,
# a click, prefix e, ...) the view is the user's: the mark goes, and moving on in the list leaves it open.
set-hook -g after-select-pane { if -F '#{@pi_fleet_agents_view}' { set-option -pu @pi_fleet_agents_view } }

##### Keys (design §7, §15) #####
# Only the deck's own prefix keys: no splits, break-pane, kill-pane, new windows or layouts, so the deck window
# always has exactly its three panes.
unbind -a -T prefix
bind C-s send-prefix
bind d detach-client
bind g detach-client
bind [ copy-mode
bind PPage copy-mode -u
bind ] paste-buffer
bind : command-prompt
bind ? list-keys
bind z resize-pane -Z
# prefix e: focus pi slot <-> nvim slot (from the list: the nvim slot).
bind e if -F '#{==:#{pane_index},1}' 'select-pane -t =deck:=deck.2' 'select-pane -t =deck:=deck.1'
# C-h/C-j/C-k/C-l: to the neighbouring pane in that direction, else the key goes to the program. Panes:
# list .0 (top-left), nvim slot .1 (below it), pi slot .2 (right). In a pi C-h always goes to the list
# (C-j/C-k: there is nothing above or below the pi, so they stay newline / kill line); in the list C-l is
# the list's own (focus the pi, read a transcript). A zoomed pane is at every edge: keys pass through.
bind -n C-h if -F '#{&&:#{pane_at_left},#{!=:#{@pi_fleet_role},pi}}' 'send-keys C-h' 'select-pane -t =deck:=deck.0'
bind -n C-j if -F '#{pane_at_bottom}' 'send-keys C-j' 'select-pane -t =deck:=deck.1'
bind -n C-k if -F '#{pane_at_top}' 'send-keys C-k' 'select-pane -t =deck:=deck.0'
bind -n C-l if -F '#{||:#{pane_at_right},#{==:#{@pi_fleet_role},list}}' 'send-keys C-l' 'select-pane -t =deck:=deck.2'
# prefix h/j/k/l (and C-h/C-j/C-k/C-l): the literal C-key, e.g. C-h in nvim insert mode.
bind h send-keys C-h
bind j send-keys C-j
bind k send-keys C-k
bind l send-keys C-l
bind C-h send-keys C-h
bind C-j send-keys C-j
bind C-k send-keys C-k
bind C-l send-keys C-l
# No right-click menus: their Kill/Respawn/Split/Swap/New entries would break a pi or the three-pane layout.
unbind -n MouseDown3Pane
unbind -n M-MouseDown3Pane
unbind -n MouseDown3Status
unbind -n MouseDown3StatusLeft
